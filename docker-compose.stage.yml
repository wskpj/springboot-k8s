services:
  mysql-stage:
    image: mysql:8.0
    container_name: springboot-mysql-stage
    restart: always
    env_file:
      - .env.stage
      - .secret.env.stage
    volumes:
      - mysql_stage_data:/var/lib/mysql
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1024M"

  app-stage:
    build: .
    container_name: springboot-app-stage
    restart: always
    env_file:
      - .env.stage
      - .secret.env.stage
    volumes:
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1024M"
    environment:
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx768m # 컨테이너 1GB 중 자바 힙에 768MB 할당

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-stage
    volumes:
      - ./prometheus/prometheus.stage.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-stage
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

volumes:
  mysql_stage_data:
