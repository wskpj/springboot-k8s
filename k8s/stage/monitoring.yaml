apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-stage-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'springboot-app-stage'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['springboot-app-stage:8080']

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-stage-datasource
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-stage:9090
        isDefault: true
        uid: prometheusdatasource
        editable: true
        jsonData:
          httpMethod: POST
          timeInterval: "5s"
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-stage:3100
        uid: lokidatasource
        editable: true
        jsonData:
          maxLines: 1000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-stage
  template:
    metadata:
      labels:
        app: prometheus-stage
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-stage-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-stage
spec:
  type: NodePort
  selector:
    app: prometheus-stage
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-stage
  template:
    metadata:
      labels:
        app: grafana-stage
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          volumeMounts:
            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
      volumes:
        - name: grafana-datasource
          configMap:
            name: grafana-stage-datasource

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-stage
spec:
  type: NodePort
  selector:
    app: grafana-stage
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
