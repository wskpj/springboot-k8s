apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-app-stage
  template:
    metadata:
      labels:
        app: springboot-app-stage
    spec:
      containers:
        - name: springboot-app
          image: springboot-app:latest # (Kind 등 로컬에 빌드해둔 이미지 사용 필요)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: springboot-stage-config
            - secretRef:
                name: springboot-stage-secret
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx768m"
          resources:
            requests:
              cpu: "0.5"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe: # 이 Probe를 통과해야 트래픽을 받습니다.
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10

---
apiVersion: v1
kind: Service
metadata:
  name: springboot-app-stage
spec:
  type: NodePort # Kind 클러스터 외부(사용자 PC) 접속용
  selector:
    app: springboot-app-stage
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080 # 브라우저에서 localhost:30080 접근
