labels:
  - pairs:
      env: stage
    includeSelectors: false

resources:
  - ../../base
  - ../../monitoring

configMapGenerator:
  - name: global-env-config
    envs:
      - .env.stage

secretGenerator:
  - name: global-env-secret
    envs:
      - .secret.env.stage

images:
  - name: springboot-app
    newName: localhost:5001/springboot-app
    newTag: latest
