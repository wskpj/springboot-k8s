apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.monitoring.prometheus.name }}-sa
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.monitoring.prometheus.name }}-clusterrole
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.monitoring.prometheus.name }}-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.monitoring.prometheus.name }}-clusterrole
subjects:
- kind: ServiceAccount
  name: {{ .Values.monitoring.prometheus.name }}-sa
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.monitoring.prometheus.name }}
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.monitoring.prometheus.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.monitoring.prometheus.name }}
    spec:
      serviceAccountName: {{ .Values.monitoring.prometheus.name }}-sa
      containers:
        - name: {{ .Values.monitoring.prometheus.name }}
          image: {{ .Values.monitoring.prometheus.image }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: {{ .Values.monitoring.prometheus.service.port }}
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config
          configMap:
            name: {{ .Values.monitoring.prometheus.existingConfigMap }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.monitoring.prometheus.name }}
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.monitoring.prometheus.name }}
  ports:
    - port: {{ .Values.monitoring.prometheus.service.port }}
      targetPort: {{ .Values.monitoring.prometheus.service.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.monitoring.grafana.name }}
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.monitoring.grafana.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.monitoring.grafana.name }}
    spec:
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafana.image }}
          ports:
            - containerPort: {{ .Values.monitoring.grafana.service.port }}
          volumeMounts:
            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: grafana-dashboards
              mountPath: /etc/grafana/dashboards
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-datasource
          configMap:
            name: {{ .Values.monitoring.grafana.existingDatasourceConfigMap }}
        - name: grafana-dashboard-provider
          configMap:
            name: {{ .Values.monitoring.grafana.existingDashboardProviderConfigMap }}
        - name: grafana-dashboards
          configMap:
            name: {{ .Values.monitoring.grafana.existingDashboardsConfigMap }}
        - name: grafana-data
          persistentVolumeClaim:
            claimName: {{ .Values.monitoring.grafana.name }}-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.monitoring.grafana.name }}-pvc
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.monitoring.grafana.name }}
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.monitoring.grafana.name }}
  ports:
    - port: {{ .Values.monitoring.grafana.service.port }}
      targetPort: {{ .Values.monitoring.grafana.service.port }}
