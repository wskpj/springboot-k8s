apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.logging.loki.name }}
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.logging.loki.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.logging.loki.name }}
    spec:
      containers:
        - name: {{ .Values.logging.loki.name }}
          image: {{ .Values.logging.loki.image }}
          ports:
            - containerPort: {{ .Values.logging.loki.service.port }}
          env:
            - name: TZ
              value: Asia/Seoul
          securityContext:
            runAsUser: 0
            privileged: true
          volumeMounts:
            - name: loki-data
              mountPath: /loki
      volumes:
        - name: loki-data
          hostPath:
            path: /kind/data/loki
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.logging.loki.name }}
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.logging.loki.service.port }}
      targetPort: {{ .Values.logging.loki.service.port }}
  selector:
    app: {{ .Values.logging.loki.name }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.logging.promtail.name }}-clusterrole
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
  verbs: ["get", "watch", "list"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.logging.promtail.name }}-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.logging.promtail.name }}-clusterrolebinding
subjects:
  - kind: ServiceAccount
    name: {{ .Values.logging.promtail.name }}-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: {{ .Values.logging.promtail.name }}-clusterrole
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.logging.promtail.name }}
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.logging.promtail.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.logging.promtail.name }}
    spec:
      serviceAccountName: {{ .Values.logging.promtail.name }}-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Values.logging.promtail.name }}
          image: {{ .Values.logging.promtail.image }}
          args:
            - -config.file=/etc/promtail/promtail.yaml
          env:
            - name: TZ
              value: Asia/Seoul
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: docker
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Values.logging.promtail.existingConfigMap }}
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: docker
          hostPath:
            path: /var/lib/docker/containers
