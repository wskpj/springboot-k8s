{{- if .Values.monitoring.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-stage-sa
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-stage-clusterrole
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingresses
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-stage-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-stage-clusterrole
subjects:
- kind: ServiceAccount
  name: prometheus-stage-sa
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-stage
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-stage
  template:
    metadata:
      labels:
        app: prometheus-stage
    spec:
      serviceAccountName: prometheus-stage-sa
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheus.image }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: prometheus-config
          configMap:
            name: {{ .Values.monitoring.prometheus.existingConfigMap }}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-stage
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.monitoring.prometheus.service.type }}
  selector:
    app: prometheus-stage
  ports:
    - port: {{ .Values.monitoring.prometheus.service.port }}
      targetPort: 9090
      {{- if and (eq .Values.monitoring.prometheus.service.type "NodePort") .Values.monitoring.prometheus.service.nodePort }}
      nodePort: {{ .Values.monitoring.prometheus.service.nodePort }}
      {{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-stage
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-stage
  template:
    metadata:
      labels:
        app: grafana-stage
    spec:
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafana.image }}
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: grafana-dashboards
              mountPath: /etc/grafana/dashboards
            - name: grafana-data
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-datasource
          configMap:
            name: {{ .Values.monitoring.grafana.existingDatasourceConfigMap }}
        - name: grafana-dashboard-provider
          configMap:
            name: {{ .Values.monitoring.grafana.existingDashboardProviderConfigMap }}
        - name: grafana-dashboards
          configMap:
            name: {{ .Values.monitoring.grafana.existingDashboardsConfigMap }}
        - name: grafana-data
          {{- if .Values.monitoring.grafana.persistence.enabled }}
          persistentVolumeClaim:
            claimName: grafana-stage-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}

---
{{- if .Values.monitoring.grafana.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-stage-pvc
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.monitoring.grafana.persistence.size }}
  {{- if .Values.monitoring.grafana.persistence.storageClassName }}
  storageClassName: {{ .Values.monitoring.grafana.persistence.storageClassName }}
  {{- end }}
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-stage
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.monitoring.grafana.service.type }}
  selector:
    app: grafana-stage
  ports:
    - port: {{ .Values.monitoring.grafana.service.port }}
      targetPort: 3000
      {{- if and (eq .Values.monitoring.grafana.service.type "NodePort") .Values.monitoring.grafana.service.nodePort }}
      nodePort: {{ .Values.monitoring.grafana.service.nodePort }}
      {{- end }}
{{- end }}
