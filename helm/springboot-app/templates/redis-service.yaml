{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis-stage
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: 6379
      protocol: TCP
  selector:
    app: redis-stage
{{- end }}
