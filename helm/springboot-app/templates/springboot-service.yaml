apiVersion: v1
kind: Service
metadata:
  name: {{ include "springboot-app.fullname" . }}
  labels:
    {{- include "springboot-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.application.service.type }}
  selector:
    {{- include "springboot-app.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.application.service.port }}
      targetPort: http
      {{- if and (eq .Values.application.service.type "NodePort") .Values.application.service.nodePort }}
      nodePort: {{ .Values.application.service.nodePort }}
      {{- end }}
