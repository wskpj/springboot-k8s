services:
  mysql:
    image: mysql:8.0
    container_name: springboot-mysql
    restart: always
    env_file:
      - .env
      - .secret.env
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3316:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.0
    container_name: springboot-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: springboot-app
    restart: always
    env_file:
      - .env
      - .secret.env
    volumes:
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
