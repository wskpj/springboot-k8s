services:
  mysql:
    image: mysql:8.0
    container_name: springboot-mysql
    restart: always
    env_file:
      - .env
      - .secret.env
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  app:
    build: .
    container_name: springboot-app
    restart: always
    env_file:
      - .env
      - .secret.env
    volumes:
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  mysql_data:
